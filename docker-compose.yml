services:
  app1:
    build: .
    platform: linux/amd64
    environment:
      - SERVER_PORT=8080
    networks:
      - backend
  app2:
    build: .
    platform: linux/amd64
    environment:
      - SERVER_PORT=8080
    networks:
      - backend
  nginx:
    image: nginx:latest
    platform: linux/amd64
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:80"
    depends_on:
      - app1
      - app2
    networks:
      - backend
networks:
  backend:
    driver: bridge